# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Maven tests and Spring Boot run check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    runs-on: ubuntu-latest

    # default working directory for backend maven project
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and install recon-audit-starter (TICKET-ADV095)
        working-directory: recon-audit-starter
        run: ../backend/mvnw -B -f pom.xml install

      - name: Verify with Maven
        run: ./mvnw -B verify

      - name: Start Spring Boot application
        run: |
          ./mvnw spring-boot:run > app.log 2>&1 &
          echo $! > app.pid

      - name: Verify Spring Boot server runs
        run: |
          sleep 20

          if kill -0 "$(cat app.pid)" 2>/dev/null; then
            echo "Application started successfully."
          else
            echo "Application terminated during startup."
            echo "===== Application log ====="
            cat app.log
            exit 1
          fi

      - name: Stop application
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill "$(cat app.pid)" || true
          fi
